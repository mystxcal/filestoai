[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mystxcal/filestoai"
authors = ["mystxcal"]

[workspace.dependencies]
filestoai-core = { path = "crates/core", version = "0.1.0" }
filestoai-server = { path = "crates/server", version = "0.1.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
